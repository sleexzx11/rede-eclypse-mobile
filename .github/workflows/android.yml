name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          sudo apt-get update && sudo apt-get install -y wget unzip
          mkdir -p app_pojavlauncher/libs
          wget -q -O app_pojavlauncher/libs/ltw-release.aar https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Extract Official JRE Runtimes (Java 17, 21, 8)
        run: |
          echo "Baixando e extraindo os runtimes oficiais do Java (17, 21, 8)..."
          wget -q -O /tmp/pojav.apk https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk
          mkdir -p /tmp/pojav_extracted
          unzip -q /tmp/pojav.apk "assets/components/*" -d /tmp/pojav_extracted/
          mkdir -p app_pojavlauncher/src/main/assets/components
          cp -r /tmp/pojav_extracted/assets/components/jre* app_pojavlauncher/src/main/assets/components/
          rm -rf /tmp/pojav.apk /tmp/pojav_extracted
          echo "Runtimes do Java embutidos com sucesso!"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/Rede-Eclypse-Mobile.apk
          cd out && md5sum Rede-Eclypse-Mobile.apk > Rede-Eclypse-Mobile.md5

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rede-Eclypse-Mobile-APK
          path: out/Rede-Eclypse-Mobile.*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Rede Eclypse Mobile v1.0.0 (APK Oficial)"
          body: |
            ### 📱 Launcher Mobile Oficial da Rede Eclypse
            - **Minecraft 1.20.1** com **Forge 47.4.10**
            - **Java 17 e Java 21 integrados** (compatível com ARM64, ARM32 e x86_64 para emuladores)
            - **Servidor:** `sp-02.magnohost.com.br:25518` (já embutido na lista de servidores)
            - **Auto-Update:** Sincronização automática de mods via GitHub no botão Jogar.
          files: |
            out/Rede-Eclypse-Mobile.apk
            out/Rede-Eclypse-Mobile.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
